name: Go

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go: [ go.mod, stable ]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: matrix.go == 'go.mod'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-go@v7
        if: matrix.go != 'go.mod'
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -timeout=5m -race -count=1 ./...

  cross-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: go vet and test build for every target
        shell: bash
        run: |
          failed=()
          for target in \
            linux/386 linux/amd64 linux/arm linux/arm64 linux/mips linux/mipsle \
            linux/mips64 linux/riscv64 linux/loong64 linux/s390x linux/ppc64le \
            windows/386 windows/amd64 windows/arm64 \
            darwin/amd64 darwin/arm64 \
            freebsd/386 freebsd/amd64 freebsd/arm64 \
            openbsd/amd64 netbsd/amd64 dragonfly/amd64 \
            solaris/amd64 illumos/amd64 aix/ppc64 \
            android/arm64 \
            js/wasm wasip1/wasm plan9/amd64
          do
            export GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0
            echo "::group::$target"
            { go vet ./... && go test -timeout=30s -c -o /dev/null ./...; } || failed+=("$target")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::failed targets: ${failed[*]}"
            exit 1
          fi

  ios-vet:
    # ios needs cgo, and runtime/cgo's arm64 assembly needs an Apple toolchain.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: CGO_ENABLED=1 GOOS=ios GOARCH=arm64 go vet ./...

  js-wasm-test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: go test on js/wasm under node
        # The WebAssembly runner reserves limited space for the process environment.
        run: |
          goroot=$(go env GOROOT)
          export PATH="$PATH:$goroot/lib/wasm"
          GOOS=js GOARCH=wasm go test -exec "env -i 'PATH=$PATH' go_js_wasm_exec" -timeout=30s -count=1 ./...

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt -l
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: lint (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        goos: [ linux, darwin, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: install lint tools for the runner
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: staticcheck
        run: staticcheck -checks all ./...
        env:
          GOOS: ${{ matrix.goos }}
      - name: golangci-lint
        run: golangci-lint run ./...
        env:
          GOOS: ${{ matrix.goos }}
